name: 🚀 Deploy to Cloudflare Pages (on push)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/data/published.json'
      - 'backend/data/gemini_usage.json'
      - '**.md'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy docs/ to Cloudflare Pages
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:   pages deploy docs --project-name=soontrend --commit-dirty=true
