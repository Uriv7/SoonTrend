name: 🤖 Daily Content Generator + Deploy

on:
  schedule:
    - cron: '0 3 * * *'    # 8:30 AM IST
    - cron: '0 9 * * *'    # 2:30 PM IST  
    - cron: '0 15 * * *'   # 8:30 PM IST
    - cron: '0 3 * * *'     # 8:30 AM IST
    - cron: '0 9 * * *'     # 2:30 PM IST
    - cron: '0 15 * * *'    # 8:30 PM IST
  workflow_dispatch:
  push:
    paths:
      - 'backend/data/published.json'        # Manual trigger from GitHub UI anytime
      - 'backend/data/published.json'

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout full history so we can push back ──────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Ensure all needed directories and seed files exist ─────────────
      - name: Prepare workspace
        run: |
          mkdir -p backend/data
          mkdir -p docs/articles docs/topics docs/privacy docs/terms docs/assets
          [ -f backend/data/published.json ]    || echo "[]"                          > backend/data/published.json
          mkdir -p backend/data docs/articles docs/assets docs/topics
          mkdir -p docs/privacy docs/terms docs/about docs/contact
          [ -f backend/data/published.json ]    || echo "[]"                              > backend/data/published.json
          [ -f backend/data/gemini_usage.json ] || echo '{"date":"2000-01-01","count":0}' > backend/data/gemini_usage.json

      # ── 4. Run generator (Gemini Flash → Groq auto-fallback) ──────────────
      - name: Generate articles
      - name: Generate 4 Articles + 4 NewsArticles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          NEWS_API_KEY:   ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY:  ${{ secrets.GNEWS_API_KEY }}
        run: python main.py

      # ── 5. Summary ────────────────────────────────────────────────────────
      - name: Show results
      - name: Summary
        run: |
          echo "=========================================="
          echo " Articles live: $(ls docs/articles/ | wc -l)"
          echo " Latest:"
          ls -t docs/articles/ | head -5
          echo "=========================================="
          echo "======================================"
          echo "Total articles: $(ls docs/articles/ | wc -l)"
          echo "Latest:"
          ls -t docs/articles/ | head -8
          echo "======================================"

      # ── 6. Deploy to Cloudflare Pages via Wrangler ────────────────────────
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:     pages deploy docs --project-name=soontrend --commit-dirty=true
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:   pages deploy docs --project-name=soontrend --commit-dirty=true
